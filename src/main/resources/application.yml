server:
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:./data/ssutime.db}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.sqlite.JDBC}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
        format_sql: true

jwt:
  secret: ${JWT_SECRET:dev-secret-key-minimum-32-chars-for-local}
  expiry-minutes: ${JWT_EXPIRY_MINUTES:60}

fcm:
  credentials-path: ${FCM_CREDENTIALS_PATH:}
  credentials-json: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:}

notification:
  crawl-trigger:
    interval-minutes: ${CRAWL_TRIGGER_INTERVAL_MINUTES:15}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
